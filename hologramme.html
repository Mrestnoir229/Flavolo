<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flavolo – Vidéos pour hologramme</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #000; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 16px; }
    h1 { font-size: 22px; font-weight: 600; }
    p { color: #aaa; font-size: 14px; max-width: 640px; text-align: center; line-height: 1.5; }
    /* Aperçu : le cercle montre la zone visible sur le ventilateur holographique */
    #preview { position: relative; width: min(80vmin, 600px); aspect-ratio: 1; border-radius: 50%; outline: 1px dashed #444; overflow: hidden; }
    #models { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 700px; }
    button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #555; background: #111; color: #fff; cursor: pointer; }
    button.on { background: #8a4dff; border-color: #8a4dff; }
    #export { background: #ffc400; border-color: #ffc400; color: #000; font-weight: 700; padding: 12px 26px; }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 20px; color: #ffc400; font-size: 14px; }
    /* Cadre hors écran où les images de la vidéo sont dessinées, à la taille exacte */
    #stage { position: fixed; left: -5000px; top: 0; width: 1080px; height: 1080px; }
  </style>
</head>
<body>
  <h1>Flavolo – Vidéos pour hologramme</h1>
  <div id="preview"></div>
  <div id="models"></div>
  <button id="export">Exporter les vidéos MP4</button>
  <div id="status"></div>
  <p>Chaque modèle donne une vidéo carrée de 1080 × 1080, 10 secondes, sur fond noir (le noir est transparent sur un ventilateur holographique). Le modèle fait un tour complet : la vidéo tourne en boucle sans saut.</p>
  <div id="stage"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
      }
    }
  </script>
  <script type="module" src="taste3d.js"></script>
  <script type="module" src="hologramme.js"></script>
</body>
</html>
